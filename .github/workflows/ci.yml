name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: true

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - run: task build
      - run: task test
      - run: task lint
      - run: task vulncheck

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pgsavvy
          POSTGRES_PASSWORD: pgsavvy
          POSTGRES_DB: pgsavvy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: true

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.39.2
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for postgres
        run: until pg_isready -h localhost -U pgsavvy; do sleep 1; done
        timeout-minutes: 2

      - name: Enable and verify prepared transactions in owned Docker fixture
        shell: bash
        run: |
          container='${{ job.services.postgres.id }}'
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U pgsavvy -d pgsavvy_test -c 'ALTER SYSTEM SET max_prepared_transactions = 20'
          docker restart "$container"
          for attempt in {1..60}; do
            if docker exec "$container" pg_isready -U pgsavvy -d pgsavvy_test; then break; fi
            sleep 1
          done
          test "$(docker exec "$container" psql -At -v ON_ERROR_STOP=1 -U pgsavvy -d pgsavvy_test -c 'SHOW max_prepared_transactions')" = 20

      - name: Apply fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=pgsavvy psql -h localhost -U pgsavvy -d pgsavvy_test -f docker/postgres/init/01_fixture.sql

      - name: Run integration tests
        env:
          PGSAVVY_TEST_PG: 'postgres://pgsavvy:pgsavvy@localhost:5432/pgsavvy_test?sslmode=disable'
        run: task test:integration
